<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Ferretería Max</title>
  <meta name="description" content="Catálogo de productos de ferretería con precios en colones.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/tema.css">
  <script src="/js/comun.js" defer></script>
  <script src="/js/catalogo.js" defer></script>
</head>
<body>
  <div id="encabezado"></div>

  <main id="contenido">
    <div class="titulo-pagina">
      <div class="contenedor">
        <h1 id="titulo-catalogo">Catálogo</h1>
        <p>Precios en colones con IVA incluido. La disponibilidad se actualiza con el inventario de la tienda.</p>
      </div>
    </div>

    <div class="contenedor catalogo">
      <aside class="filtros" id="filtros" aria-label="Filtros">
        <h2>Categorías</h2>
        <ul class="lista-categorias" id="lista-categorias"></ul>

        <h2>Precio</h2>
        <form id="form-precio">
          <div class="fila-campos">
            <div class="campo"><label for="min">Desde (₡)</label><input type="number" id="min" min="0" step="100" inputmode="numeric" placeholder="0"></div>
            <div class="campo"><label for="max">Hasta (₡)</label><input type="number" id="max" min="0" step="100" inputmode="numeric" placeholder="Sin límite"></div>
          </div>
          <label class="casilla"><input type="checkbox" id="solo-ofertas"> Solo ofertas</label>
          <label class="casilla" style="margin-top:.6rem"><input type="checkbox" id="solo-disponibles"> Ocultar agotados</label>
          <div class="botones-fila" style="margin-top:1.1rem">
            <button class="boton boton-oscuro boton-chico" type="submit">Aplicar</button>
            <button class="boton boton-borde boton-chico" type="button" id="limpiar">Limpiar filtros</button>
          </div>
        </form>
      </aside>

      <section aria-labelledby="titulo-catalogo">
        <div class="barra-resultados">
          <form class="buscador" id="form-buscar" role="search">
            <label class="solo-lector" for="q">Buscar productos</label>
            <input type="search" id="q" placeholder="Buscar por nombre, uso o categoría">
            <button class="boton boton-oscuro" type="submit">Buscar</button>
          </form>
          <button class="boton boton-borde boton-filtros" type="button" id="boton-filtros" aria-expanded="false" aria-controls="filtros">Filtros</button>
          <label class="solo-lector" for="orden">Ordenar por</label>
          <select id="orden">
            <option value="">Ordenar: por categoría</option>
            <option value="precio_asc">Precio: menor a mayor</option>
            <option value="precio_desc">Precio: mayor a menor</option>
            <option value="nombre">Nombre: A a Z</option>
            <option value="recientes">Más recientes</option>
          </select>
        </div>
        <p class="texto-suave" id="conteo" aria-live="polite"></p>
        <div class="rejilla-productos" id="resultados"><p class="cargando">Cargando productos…</p></div>
      </section>
    </div>
  </main>

  <div id="pie"></div>
</body>
</html>
