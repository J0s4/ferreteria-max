<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Ferretería Max</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/tema.css">
  <script src="/js/comun.js" defer></script>
  <script src="/js/contacto.js" defer></script>
</head>
<body>
  <div id="encabezado"></div>

  <main id="contenido">
    <div class="titulo-pagina">
      <div class="contenedor">
        <h1>Contacto</h1>
        <p>Cotizaciones, pedidos especiales o dudas sobre un producto. Respondemos en horario de oficina.</p>
      </div>
    </div>
    <div class="contenedor dos-columnas">
      <section class="panel" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Escríbanos</h2>
        <div id="mensaje" class="oculto" role="alert"></div>
        <form id="form-contacto" novalidate>
          <div class="fila-campos">
            <div class="campo"><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" autocomplete="name" required maxlength="80"></div>
            <div class="campo"><label for="telefono">Teléfono (opcional)</label><input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="8888-1234"></div>
          </div>
          <div class="campo"><label for="correo">Correo</label><input type="email" id="correo" name="correo" autocomplete="email" required></div>
          <div class="campo"><label for="asunto">Asunto (opcional)</label><input type="text" id="asunto" name="asunto" maxlength="120" placeholder="Ej.: Cotización de materiales"></div>
          <div class="campo"><label for="texto">Mensaje</label><textarea id="texto" name="mensaje" required maxlength="2000"></textarea></div>
          <button class="boton" type="submit">Enviar mensaje</button>
        </form>
      </section>
      <aside class="panel datos-contacto" id="datos-contacto" aria-label="Datos de contacto"></aside>
    </div>
  </main>

  <div id="pie"></div>
</body>
</html>
