<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/tema.css">
  <script src="__RUTA__/login.js" defer></script>
</head>
<body class="pagina-aviso">
  <main class="aviso-completo" style="max-width:440px">
    <div class="franja-precaucion" aria-hidden="true"></div>
    <img src="/img/logo.svg" alt="" class="aviso-logo">
    <h1 style="font-size:2.2rem">Acceso restringido</h1>
    <div id="mensaje" class="oculto" role="alert"></div>
    <form id="form-maestro" class="panel" novalidate style="color:var(--tinta)">
      <div class="campo"><label for="correo">Correo</label><input type="email" id="correo" name="correo" autocomplete="username" required></div>
      <div class="campo"><label for="contrasena">Contraseña</label><input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required></div>
      <button class="boton boton-ancho" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
